name: Android APK

# 手动触发：GitHub → Actions → 左侧选 “Android APK” → Run workflow → 运行结束后在该次运行页底部下载 APK
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: 安装 Android SDK 34（与 capacitor variables.gradle 对齐）
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 安装网页依赖
        working-directory: src
        run: npm ci

      - name: 构建网页产物（vite 输出到 .tmp/dist-split）
        working-directory: src
        run: npm run build

      - name: 同步 Capacitor（拷入网页资源 + 注册原生插件）
        working-directory: src
        run: npx cap sync android

      - name: 编译 debug APK
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK（在该次运行的 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: xlfuncs-android-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
