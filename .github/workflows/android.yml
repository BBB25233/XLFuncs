name: Android APK

# 触发方式：
#  1) 手动：Actions → 左侧 “Android APK” → Run workflow（结果在本次运行的 Artifacts 里下载）
#  2) 发布 Release：在仓库发布（Publish）一个 Release 时自动构建，
#     并把 APK 作为资产挂到该 Release 的下载区（与 ci.yml 挂 index-v1.html 同理）
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 把 APK 挂到 Release 资产需要写权限
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 不再使用 android-actions/setup-android：它会执行 `sdkmanager tools`，
      # 而 Google 已下架 tools 包，导致 setup 步骤直接失败（sdkmanager exit 1）。
      # ubuntu-latest 本身预装 Android SDK，这里直接用预装的 sdkmanager 补齐 platform 34。
      - name: 准备 Android SDK 34（使用 runner 预装）
        run: |
          set -e
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: 安装网页依赖
        working-directory: src
        run: npm ci

      - name: 构建网页产物（vite 输出到 .tmp/dist-split）
        working-directory: src
        run: npm run build

      - name: 同步 Capacitor（拷入网页资源 + 注册原生插件）
        working-directory: src
        run: npx cap sync android

      - name: 编译 debug APK
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 复制为发布名（含版本号，便于识别）
        run: cp src/android/app/build/outputs/apk/debug/app-debug.apk "XLFuncs-android-${GITHUB_REF_NAME}.apk"

      - name: 上传为工作流产物（手动触发时在 Artifacts 下载）
        uses: actions/upload-artifact@v4
        with:
          name: xlfuncs-android-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 挂到 Release 下载资产（仅发布 Release 时）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: XLFuncs-android-*.apk
