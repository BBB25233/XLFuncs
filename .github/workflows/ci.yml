name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run lint        # ESLint（react-hooks / 未使用变量）
      - run: npm run test        # 全部 vitest 单测 + 一致性审计
      - run: npm run build       # 类型检查 + 分包构建到 .tmp/dist-split/
      - run: npm run build:deliver # 类型检查 + 单文件构建并复制到 delivery/index-v1.html
